services:
  # DealFlow360 Backend Web Service
  - type: web
    name: dealflow360-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: dealflow360-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: "*"

  # DealFlow360 Frontend Static Site
  - type: web
    name: dealflow360-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: dealflow360-backend
          property: host
          path: /api

databases:
  # DealFlow360 PostgreSQL Database
  - name: dealflow360-db
    plan: free
    databaseName: dealflow360
    user: dealflow360_user
